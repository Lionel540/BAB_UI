<section class="hex-stage">
  <div class="flex items-center justify-between gap-4">
    <div>
      <p class="eyebrow">Active Matrix</p>
      <h2 class="mt-4 font-display text-3xl text-white">Hex control field</h2>
    </div>
    <span class="metric-chip">Pulse Enabled</span>
  </div>
  <div class="mt-10 space-y-3">
    <div class="hex-grid">
      <div class="hex-cell"><button type="button">A1</button></div>
      <div class="hex-cell"><button type="button">A2</button></div>
      <div class="hex-cell is-active is-pulse"><button type="button">A3</button></div>
      <div class="hex-cell"><button type="button">A4</button></div>
    </div>
    <div class="hex-grid hex-row-offset">
      <div class="hex-cell"><button type="button">B1</button></div>
      <div class="hex-cell"><button type="button">B2</button></div>
      <div class="hex-cell"><button type="button">B3</button></div>
      <div class="hex-cell"><button type="button">B4</button></div>
    </div>
  </div>
</section>
